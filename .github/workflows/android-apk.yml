name: Build Magisk Module

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magisk-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-module:
    name: Test safety, build GUI, package flashable ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test guest-only deletion and backend safety
        run: python3 -m unittest discover -s tests -v

      - name: Test companion model and argument quoting
        run: bash tests/run-companion-tests.sh

      - name: Check shell syntax
        run: |
          bash -n scripts/build.sh
          for file in module/*.sh module/bin/*.sh module/META-INF/com/google/android/update-binary; do
            sh -n "$file"
          done

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build signed companion and verified module ZIP
        run: bash scripts/build.sh

      - name: Upload flashable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: GuestGuard-v2.0.0-Magisk
          path: |
            dist/GuestGuard-v2.0.0.zip
            dist/GuestGuard-v2.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload companion separately for troubleshooting
        uses: actions/upload-artifact@v4
        with:
          name: GuestGuard-companion
          path: build/companion.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          {
            echo '## Guest Guard Magisk module'
            echo 'Backend safety tests must pass before packaging.'
            if [ -f dist/GuestGuard-v2.0.0.zip.sha256 ]; then
              echo '### ZIP checksum'
              echo '```'
              cat dist/GuestGuard-v2.0.0.zip.sha256
              echo '```'
              echo 'Download the artifact, extract it, then install the inner GuestGuard-v2.0.0.zip from Magisk. Reboot and open Guest Guard.'
              echo 'APK signature verified by apksigner. Physical-device compatibility still requires testing.'
              echo 'CI uses an ephemeral development signing key. Updates signed with a different key will not overwrite the installed app.'
            else
              echo 'No verified flashable ZIP was produced. Review the failed step; do not flash source archives.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
