plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.usermanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.usermanager'
        minSdk 28
        targetSdk 28
        versionCode 5
        versionName '1.0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
